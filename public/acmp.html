<!DOCTYPE html>
<html lang="kk" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>📚 ACMP Есептер — PyGame.okmpu</title>
  <meta name="description" content="Python ACMP есептер. Тіркелмей шығарыңыз. Биттер жинаңыз.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .acmp-layout { display:grid; grid-template-columns:260px 1fr; gap:0; height:calc(100vh - 56px); background: var(--bg); }
    @media(max-width:880px){ .acmp-layout{grid-template-columns:1fr;height:auto;} }

    /* Left sidebar: problem list */
    .prob-sidebar {
      border-right:1px solid var(--border); overflow-y:auto;
      background:var(--surface); padding:12px;
      display:flex; flex-direction:column; gap:6px;
    }
    .prob-item {
      padding:10px 12px; border-radius:12px; cursor:pointer;
      transition:var(--transition); border:1px solid transparent;
      background: var(--card);
    }
    .prob-item:hover { transform: translateY(-1.5px); box-shadow: var(--shadow-sm); border-color:var(--primary); }
    .prob-item.active { background:rgba(139, 111, 212, 0.08); border-color:var(--primary); }
    .prob-item .p-num   { font-size:10px; color:var(--text3); font-weight: 700; text-transform: uppercase; }
    .prob-item .p-title { font-weight:700; font-size:13px; margin:2px 0; color: var(--text1); line-height: 1.3; }
    .prob-item .p-meta  { display:flex; gap:5px; align-items:center; }

    /* Right: editor */
    .editor-area { display:flex; flex-direction:column; overflow:hidden; }
    .problem-pane { padding:18px 24px; border-bottom:1px solid var(--border); overflow-y:auto; max-height:35vh; background:var(--card); flex-shrink:0; }
    .editor-pane  { flex:1; padding:16px 20px; display:flex; flex-direction:column; min-height:400px; overflow-y:auto; }
    .code-area    { flex:1; min-height:280px; resize:vertical; font-size:13px; border-radius: 12px; padding: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text1); font-family: var(--font-mono); line-height: 1.6; }
    .io-row       { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
    @media(max-width:600px){ .io-row{grid-template-columns:1fr;} }
    .io-block-sm  { border:1px solid var(--border); border-radius:12px; overflow:hidden; background: var(--bg); }
    .io-label     { padding:6px 12px; border-bottom:1px solid var(--border); font-size:10px; font-weight:800; letter-spacing:0.5px; color:var(--text3); text-transform:uppercase; background: var(--surface); }
    .io-block-sm textarea, .io-block-sm pre {
      width:100%; min-height:70px; padding:10px;
      background:transparent; border:none; outline:none;
      color:var(--text1); font-family:var(--font-mono); font-size:12px;
      resize:vertical; line-height:1.6;
    }
    .io-block-sm pre { color:var(--primary); white-space:pre-wrap; word-break:break-all; min-height:80px; }

    /* Hint box */
    .hint-box {
      background:rgba(139, 111, 212, 0.05); border:1px solid rgba(139, 111, 212, 0.15);
      border-radius:12px; padding:14px; margin-top:10px; font-size:13px; line-height:1.6;
    }
    .hint-box .hint-title { color:var(--primary); font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:6px; font-size: 12px; }
    .hint-lock {
      display:flex; align-items:center; gap:10px; padding:12px 16px;
      background:rgba(139, 111, 212, 0.04); border-radius:12px; margin-top:8px;
      border:1px dashed var(--primary); font-size: 13px;
    }

    /* Bits earned animation */
    @keyframes floatUp { 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(-60px);opacity:0} }
    .bits-float { position:fixed; pointer-events:none; font-weight:800; font-size:24px; color:var(--primary); animation:floatUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; z-index:9999; text-shadow: 0 4px 12px rgba(167,139,250,0.3); }

    /* Filter strip */
    .filter-strip { display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--border); }
    .filter-chip { padding:6px 16px; border-radius:50px; border:1px solid var(--border); background:var(--card); color:var(--text2); font-size:12px; font-weight: 600; cursor:pointer; transition:var(--transition); font-family:inherit; }
    .filter-chip.active, .filter-chip:hover { border-color:var(--primary); color:var(--primary); background:rgba(167, 139, 250, 0.08); transform: translateY(-1px); }

    /* Solved indicator */
    .solved-dot { width:10px;height:10px;border-radius:50%;background:#10B981;flex-shrink:0; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" style="position:sticky;top:0;z-index:100">
    <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none">← <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);margin-right:4px;vertical-align:bottom;"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" x2="20" y1="19" y2="19"></line></svg> <span>PyGame.okmpu</span></a></div>
    <div style="font-size:14px;font-weight:600;color:var(--text2)">📚 ACMP Есептер</div>
    <div class="nav-links">
      
      <span class="bits-badge" id="nav-bits">💎 —</span>
      <span id="nav-user" style="color:var(--text2);font-size:13px"></span>
      <button id="theme-toggle" class="settings-btn" style="font-size:16px;padding:4px 8px">🌙</button>
    </div>
  </nav>

  <!-- Main layout -->
  <div class="acmp-layout">

    <!-- LEFT: Problem list -->
    <div class="prob-sidebar" id="prob-sidebar">
      <!-- Filter chips -->
      <div class="filter-strip" style="border-bottom:none;padding:4px 0;flex-wrap:wrap;gap:4px">
        <button class="filter-chip active" data-diff="all">Барлығы</button>
        <button class="filter-chip" data-diff="easy">🟢 Жеңіл</button>
        <button class="filter-chip" data-diff="medium">🟡 Орташа</button>
        <button class="filter-chip" data-diff="hard">🔴 Қиын</button>
      </div>
      <input id="prob-search" style="padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text1);font-family:inherit;font-size:12px;margin-bottom:4px" placeholder="🔍 Іздеу...">
      <div id="prob-list"></div>
    </div>

    <!-- RIGHT: Editor -->
    <div class="editor-area" id="editor-area">

      <!-- Welcome screen (shown when no problem selected) -->
      <div id="welcome-screen" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;color:var(--text3)">
        <div style="font-size:64px;margin-bottom:16px">📚</div>
        <h2 style="font-size:20px;color:var(--text1);margin-bottom:10px">ACMP Python есептер</h2>
        <p style="font-size:14px;line-height:1.7;max-width:400px">Солдан кез-келген есепті таңдаңыз.<br>Тіркелмей шығаруға болады.<br>Тіркелсеңіз — 💎 <b>бит</b> жинайсыз!</p>
        <p style="font-size:13px;margin-top:16px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.2);border-radius:12px;padding:12px 20px;color:var(--text2)">
          100% дұрыс → <b style="color:var(--primary)">+10 💎</b> бит<br>Кеңес алу → <b style="color:var(--danger)">−5 💎</b> бит
        </p>
      </div>

      <!-- Problem pane (shown when problem selected) -->
      <div class="problem-pane" id="problem-pane" style="display:none">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
          <h2 id="prob-title" style="font-size:17px;flex:1"></h2>
          <span id="prob-diff"></span>
          <span id="prob-bits-badge" style="color:#c4b5fd;font-size:12px"></span>
        </div>
        <div id="prob-statement" style="color:var(--text2);line-height:1.8;white-space:pre-wrap;font-size:13px"></div>
        <div id="prob-io" style="margin-top:12px"></div>
        <div id="prob-examples" style="margin-top:12px"></div>

        <!-- Hint (ONE type only — logic/function hint, not solution) -->
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
          <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text2)">
            💡 Логикалық кеңес <span style="color:var(--text3);font-weight:400;font-size:11px">(шешімді бермейді — тек бағыт)</span>
          </div>
          <div id="hint-area"></div>
        </div>
      </div>

      <!-- Code editor pane -->
      <div class="editor-pane" id="editor-pane" style="display:none">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <div style="font-size:11px;color:var(--text3);flex:1" id="autosave-label"></div>
          <div id="solve-result-badge"></div>
        </div>

        <textarea class="code-editor-area code-area" id="code-area"
          placeholder="# Python кодыңызды жазыңыз...&#10;n = int(input())&#10;for i in range(n):&#10;    print(i)"
          spellcheck="false"></textarea>

        <div class="io-row">
          <div class="io-block-sm">
            <div class="io-label">📥 Кіріс</div>
            <textarea id="custom-input" placeholder="Матрица, массив т.б:&#10;3 3&#10;1 2 3&#10;4 5 6&#10;7 8 9"></textarea>
          </div>
          <div class="io-block-sm">
            <div class="io-label">📤 Шығыс</div>
            <pre id="run-output"></pre>
          </div>
        </div>

        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn btn-secondary" id="run-free-btn" onclick="runFree()" style="flex:1">▶ Іске қосу</button>
          <button class="btn btn-primary"   id="run-tests-btn" onclick="runTests()" style="flex:1">🧪 Тексеру</button>
          <button class="btn btn-secondary" id="submit-btn" onclick="submitSolution()" disabled style="flex:1">✅ Жіберу</button>
        </div>

        <div id="test-results" style="margin-top:10px;max-height:200px;overflow-y:auto"></div>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="https://skulpt.org/js/skulpt.min.js"></script>
  <script src="https://skulpt.org/js/skulpt-stdlib.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/bits.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/problems.js"></script>

  <script>
    Settings.init();
    function showToast(msg,type){var c={success:'#00ff88',error:'#ff3c3c',warn:'#ffc800',info:'#7c3aed'};var t=document.createElement('div');t.style.cssText='position:fixed;top:20px;right:20px;z-index:99999;background:'+(c[type]||c.info)+';color:#000;padding:12px 20px;border-radius:10px;font-weight:700;font-family:inherit;max-width:340px;animation:slideIn .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.4)';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},3500);}
    function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

    var currentUser = null;
    try { currentUser = Auth.getCurrentUser(); } catch(e){}
    if (currentUser) {
      document.getElementById('nav-user').textContent = currentUser.display_name;
      try {
        BitsSystem.getBalance(currentUser.id).then(function(b){ document.getElementById('nav-bits').textContent='💎 '+b; }).catch(function(){});
      } catch(e){}
    }

    // Track solved problems (localStorage)
    var SOLVED_KEY = 'acmp_solved_' + (currentUser ? currentUser.id : 'anon');
    var solved = JSON.parse(localStorage.getItem(SOLVED_KEY) || '{}');

    // ── Problem list ─────────────────────────────────
    var currentFilter = 'all';
    var currentProblem = null;
    var lastTestResults = null;

    function renderList(filter, search) {
      var list = window.PROBLEMS || [];
      if (filter && filter !== 'all') list = list.filter(function(p){return p.difficulty===filter;});
      if (search) { var s=search.toLowerCase(); list = list.filter(function(p){return p.title.toLowerCase().includes(s)||String(p.id).includes(s);}); }
      var cont = document.getElementById('prob-list');
      cont.innerHTML = '';
      list.forEach(function(p) {
        var diffClass = p.difficulty==='easy'?'diff-easy':p.difficulty==='medium'?'diff-medium':'diff-hard';
        var diffTxt   = p.difficulty==='easy'?'Жеңіл':p.difficulty==='medium'?'Орташа':'Қиын';
        var isSolved  = solved[p.id];
        var div = document.createElement('div');
        div.className = 'prob-item' + (currentProblem&&currentProblem.id===p.id?' active':'');
        div.innerHTML =
          '<div class="p-num">#'+p.id+'</div>'+
          '<div class="p-title">'+escHtml(p.title)+'</div>'+
          '<div class="p-meta"><span class="'+diffClass+'">'+diffTxt+'</span>'+
          (isSolved ? '<span style="color:#10B981;font-size:12px;font-weight:700">✅ Шешілді</span>' : '')+
          '</div>';
        div.onclick = function(){ openProblem(p); };
        cont.appendChild(div);
      });
      if (!list.length) cont.innerHTML='<div style="text-align:center;color:var(--text3);padding:20px;font-size:12px">Есеп табылмады</div>';
    }

    document.querySelectorAll('.filter-chip').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-chip').forEach(function(b){b.classList.remove('active');});
        this.classList.add('active');
        currentFilter = this.dataset.diff;
        renderList(currentFilter, document.getElementById('prob-search').value);
      });
    });
    document.getElementById('prob-search').addEventListener('input', function(){
      renderList(currentFilter, this.value);
    });
    renderList('all', '');

    // ── Open problem ─────────────────────────────────
    function openProblem(p) {
      currentProblem = p;
      lastTestResults = null;
      document.getElementById('welcome-screen').style.display  = 'none';
      document.getElementById('problem-pane').style.display    = 'block';
      document.getElementById('editor-pane').style.display     = 'flex';
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('run-output').textContent = '';
      document.getElementById('test-results').innerHTML = '';
      document.getElementById('solve-result-badge').innerHTML = '';

      // Restore autosaved code
      var savedKey = 'acmp_code_' + (currentUser?currentUser.id:'anon') + '_' + p.id;
      document.getElementById('code-area').value = localStorage.getItem(savedKey) || '';
      document.getElementById('autosave-label').textContent = '';

      // Problem info
      var diffClass = p.difficulty==='easy'?'diff-easy':p.difficulty==='medium'?'diff-medium':'diff-hard';
      var diffTxt   = p.difficulty==='easy'?'🟢 Жеңіл':p.difficulty==='medium'?'🟡 Орташа':'🔴 Қиын';
      document.getElementById('prob-title').textContent = '#'+p.id+' '+p.title;
      document.getElementById('prob-diff').innerHTML  = '<span class="'+diffClass+'">'+diffTxt+'</span>';
      document.getElementById('prob-bits-badge').textContent = solved[p.id] ? '✅ Шешілді — +10 💎 алдыңыз' : '100% → +10 💎 бит';

      document.getElementById('prob-statement').textContent = p.statement || '';

      var ioHtml = '';
      if (p.input_format)  ioHtml += '<h4 style="color:var(--primary);font-size:12px;margin-bottom:3px">📥 Кіріс форматы:</h4><p style="color:var(--text2);font-size:12px;margin-bottom:8px">'+escHtml(p.input_format)+'</p>';
      if (p.output_format) ioHtml += '<h4 style="color:var(--primary);font-size:12px;margin-bottom:3px">📤 Шығыс форматы:</h4><p style="color:var(--text2);font-size:12px">'+escHtml(p.output_format)+'</p>';
      document.getElementById('prob-io').innerHTML = ioHtml;

      var exHtml = '';
      if (p.examples && p.examples.length) {
        exHtml += '<h4 style="color:var(--primary);font-size:12px;margin-bottom:6px">🧪 Мысал:</h4>';
        p.examples.slice(0,2).forEach(function(ex) {
          exHtml += '<div style="display:flex;gap:8px;margin-bottom:6px">'+
            '<pre style="flex:1;background:var(--surface);padding:7px 10px;border-radius:6px;font-size:11px;overflow-x:auto;white-space:pre-wrap">Кіріс:\n'+escHtml(ex.input)+'</pre>'+
            '<pre style="flex:1;background:var(--surface);padding:7px 10px;border-radius:6px;font-size:11px;overflow-x:auto;white-space:pre-wrap;color:var(--primary)">Шығыс:\n'+escHtml(ex.output)+'</pre>'+
            '</div>';
        });
      }
      document.getElementById('prob-examples').innerHTML = exHtml;

      // Hint area — ONE type only (logic/function hint, not solution)
      renderHintArea(p);

      // Update list active state
      document.querySelectorAll('.prob-item').forEach(function(el,i){
        el.classList.toggle('active', (window.PROBLEMS||[])[i] && (window.PROBLEMS||[])[i].id===p.id);
      });
    }

    function renderHintArea(p) {
      var area = document.getElementById('hint-area');
      var hintKey = 'acmp_hint_' + (currentUser?currentUser.id:'anon') + '_' + p.id;
      var alreadyBought = (currentUser && localStorage.getItem(hintKey) === 'yes');

      if (!p.hint_small && !p.hint_big) {
        area.innerHTML = '<p style="color:var(--text3);font-size:12px">Бұл есеп үшін кеңес жоқ</p>';
        return;
      }

      if (alreadyBought || !currentUser) {
        // Show hint content
        var hint = p.hint_small || p.hint_big || '';
        area.innerHTML = '<div class="hint-box">'+
          '<div class="hint-title">💡 Бағыт</div>'+
          '<div>'+escHtml(hint)+'</div>'+
          (!currentUser ? '<div style="margin-top:8px;color:var(--text3);font-size:12px">Тіркелгенде 5 💎 бит жұмсаймын</div>' : '')+
          '</div>';
      } else {
        area.innerHTML = '<div class="hint-lock">'+
          '<div style="font-size:32px">🔒</div>'+
          '<div style="flex:1">'+
            '<div style="font-weight:600;font-size:13px">Логикалық бағыт</div>'+
            '<div style="font-size:11px;color:var(--text3)">Цикл ба, рекурсия ма, қандай функция — тек соны айтады</div>'+
          '</div>'+
          '<button class="btn btn-primary btn-small" onclick="buyHint()">🔓 −5 💎</button>'+
          '</div>';
      }
    }

    async function buyHint() {
      if (!currentUser) { showToast('Кеңес алу үшін кіріңіз','warn'); return; }
      if (!currentProblem) return;
      var hintKey = 'acmp_hint_' + currentUser.id + '_' + currentProblem.id;
      try {
        var ok = await BitsSystem.buyHint(currentUser.id, String(currentProblem.id), 'small', 5);
        if (ok) {
          localStorage.setItem(hintKey, 'yes');
          renderHintArea(currentProblem);
          // Update balance display
          BitsSystem.getBalance(currentUser.id).then(function(b){ document.getElementById('nav-bits').textContent='💎 '+b; }).catch(function(){});
          showToast('Кеңес сатып алынды! -5 💎', 'success');
        }
      } catch(e) { showToast(e.message,'error'); }
    }

    // ── Runner ───────────────────────────────────────
    function runPython(code, inputLines) {
      return new Promise(function(resolve) {
        var output=''; var lines=(inputLines||[]).slice();
        try {
          Sk.configure({
            output:function(t){output+=t;},
            read:function(x){if(Sk.builtinFiles&&Sk.builtinFiles.files[x])return Sk.builtinFiles.files[x];throw new Error('Файл жоқ');},
            inputfun:function(){return Promise.resolve(lines.length?lines.shift():'');},
            inputfunTakesPromise:true, __future__:Sk.python3, execLimit:10000
          });
          Sk.misceval.asyncToPromise(function(){return Sk.importMainWithBody('<stdin>',false,code,true);})
            .then(function(){resolve({output:output.trimEnd(),error:null});})
            .catch(function(e){resolve({output:'',error:String(e).replace('TypeError:','Тип қатесі:').replace('SyntaxError:','Синтаксис қатесі:').replace('NameError:','Аты табылмады:').replace('IndentationError:','Шегіну қатесі:').replace('ZeroDivisionError:','Нолге бөлу:')});});
        } catch(e){resolve({output:'',error:String(e)});}
      });
    }

    async function runFree() {
      var code=document.getElementById('code-area').value;
      if(!code.trim()){showToast('Код жазыңыз','warn');return;}
      var inputLines=document.getElementById('custom-input').value.split('\n');
      document.getElementById('run-output').textContent='⏳...';
      document.getElementById('run-free-btn').disabled=true;
      var r=await runPython(code,inputLines);
      document.getElementById('run-output').textContent=r.error?'❌ '+r.error:(r.output||'(бос)');
      document.getElementById('run-output').style.color=r.error?'var(--danger)':'var(--primary)';
      document.getElementById('run-free-btn').disabled=false;
    }

    async function runTests() {
      if(!currentProblem)return;
      var code=document.getElementById('code-area').value;
      if(!code.trim()){showToast('Код жазыңыз','warn');return;}
      var btn=document.getElementById('run-tests-btn'); btn.disabled=true; btn.textContent='⏳...';
      document.getElementById('test-results').innerHTML='<div class="loader-spinner" style="margin:12px auto;width:28px;height:28px"></div>';

      var tests=currentProblem.test_cases||[];
      if(!tests.length){showToast('Тест жоқ — Іске қосу батырмасын пайдаланыңыз','info');btn.disabled=false;btn.textContent='🧪 Тексеру';return;}

      var results=[]; var passed=0;
      for(var i=0;i<tests.length;i++){
        var tc=tests[i];
        var inp=(tc.input||'').split('\n');
        var expected=(tc.expected_output||tc.output||'').trim();
        var r=await runPython(code,inp);
        var got=(r.output||'').trim();
        var ok=!r.error&&got===expected;
        if(ok)passed++;
        results.push({n:i+1,ok,inp:tc.input||'',expected,got:r.error||got});
      }
      lastTestResults={score:Math.round(passed/tests.length*100),passed,total:tests.length};

      var html='<table class="data-table" style="font-size:11px"><tr><th>#</th><th>Кіріс</th><th>Күтілген</th><th>Нәтиже</th><th>✓</th></tr>';
      results.forEach(function(r){
        html+='<tr class="test-result-row"><td>'+r.n+'</td>'+
          '<td style="max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escHtml((r.inp||'').split('\n')[0])+'</td>'+
          '<td>'+escHtml(r.expected)+'</td>'+
          '<td style="color:'+(r.ok?'var(--primary)':'var(--danger)')+'">'+escHtml(r.got)+'</td>'+
          '<td class="'+(r.ok?'test-pass':'test-fail')+'">'+(r.ok?'✅':'❌')+'</td></tr>';
      });
      html+='</table>';
      var sc=lastTestResults.score>=100?'score-100':lastTestResults.score>=50?'score-mid':'score-low';
      html+='<div style="text-align:center;margin-top:6px"><span class="score-badge '+sc+'">'+lastTestResults.passed+'/'+lastTestResults.total+' — '+lastTestResults.score+'%</span></div>';
      document.getElementById('test-results').innerHTML=html;
      document.getElementById('submit-btn').disabled=false;
      btn.disabled=false; btn.textContent='🧪 Тексеру';

      // Update result badge in editor header
      var bdg=document.getElementById('solve-result-badge');
      bdg.innerHTML='<span class="score-badge '+sc+'" style="font-size:11px">'+lastTestResults.score+'%</span>';
    }

    async function submitSolution() {
      if(!lastTestResults||!currentProblem)return;
      var btn=document.getElementById('submit-btn');
      
      var code = document.getElementById('code-area').value;
      var savedKey='acmp_code_'+(currentUser?currentUser.id:'anon')+'_'+currentProblem.id;
      localStorage.setItem(savedKey, code);

      if(!currentUser) {
        // Guest submission
        let guestName = localStorage.getItem('lms_guest_name') || '';
        let inputName = prompt('Ұпай жинау үшін атыңызды жазыңыз (немесе бұрынғы атыңызды қалдырыңыз):', guestName);
        if (!inputName || !inputName.trim()) {
          showToast('Атыңызды жазбасаңыз, рейтингке қосылмайсыз', 'warn');
          return;
        }
        guestName = inputName.trim();
        localStorage.setItem('lms_guest_name', guestName);

        btn.disabled = true; btn.textContent = '⏳...';
        try {
          await API.guests.saveScore(guestName, lastTestResults.score);
          showToast('🎉 Рейтингке сәтті қосылдыңыз! (' + guestName + ')', 'success');
        } catch(e) { showToast(e.message, 'error'); }
        btn.disabled = false; btn.textContent = '✅ Жіберу';
        return;
      }

      // Logged in user
      btn.disabled = true; btn.textContent = '⏳...';
      try {
        await API.submissions.create({
          assignment_id:null, course_id:null,
          acmp_problem_id:currentProblem.id,
          code:code,
          score:lastTestResults.score,
          passed_tests:lastTestResults.passed,
          total_tests:lastTestResults.total
        });

        if(lastTestResults.score===100 && !solved[currentProblem.id]) {
          try {
            await BitsSystem.earn(currentUser.id, 10, 'ACMP #'+currentProblem.id+' '+currentProblem.title);
            solved[currentProblem.id]=true;
            localStorage.setItem(SOLVED_KEY,JSON.stringify(solved));
            BitsSystem.getBalance(currentUser.id).then(function(b){document.getElementById('nav-bits').textContent='💎 '+b;}).catch(function(){});
            // Float animation
            var el=document.createElement('div');
            el.className='bits-float'; el.textContent='+10 💎';
            el.style.cssText='top:50%;left:50%;transform:translateX(-50%)';
            document.body.appendChild(el);
            setTimeout(function(){el.remove();},1600);
            showToast('🎉 Тамаша! 100% — +10 💎 бит жинадыңыз!','success');
            document.getElementById('prob-bits-badge').textContent='✅ Шешілді — +10 💎 алдыңыз';
            renderList(currentFilter, document.getElementById('prob-search').value);
          } catch(e){}
        } else if(lastTestResults.score===100) {
          showToast('Жіберілді! (бұл есепті бұрын шешкенсіз)','info');
        } else {
          showToast('Жіберілді! Балл: '+lastTestResults.score+'%','success');
        }
      } catch(e) { showToast(e.message, 'error'); }
      btn.disabled = false; btn.textContent = '✅ Жіберу';
    }

    // ── Autosave ─────────────────────────────────────
    setInterval(function(){
      if(!currentProblem)return;
      var code=document.getElementById('code-area').value;
      if(code.trim()){
        var key='acmp_code_'+(currentUser?currentUser.id:'anon')+'_'+currentProblem.id;
        localStorage.setItem(key,code);
        var now=new Date();
        document.getElementById('autosave-label').textContent='💾 '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
      }
    },4000);

    // ── Tab key ──────────────────────────────────────
    document.getElementById('code-area').addEventListener('keydown', function(e) {
      if(e.key==='Tab'){
        e.preventDefault();
        var s=this.selectionStart,end=this.selectionEnd;
        this.value=this.value.substring(0,s)+'    '+this.value.substring(end);
        this.selectionStart=this.selectionEnd=s+4;
      }
      if(e.key==='Enter'){
        var s=this.selectionStart;
        var lastLine=this.value.substring(0,s).split('\n').pop();
        var indent=lastLine.match(/^(\s*)/)[1];
        if(lastLine.trimEnd().endsWith(':'))indent+='    ';
        var area=this;
        setTimeout(function(){
          var pos=area.selectionStart;
          var v=area.value;
          area.value=v.substring(0,pos)+indent+v.substring(pos);
          area.selectionStart=area.selectionEnd=pos+indent.length;
        },0);
      }
    });
  </script>
</body>
</html>
