<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Бет табылмады | PyGame.okmpu</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;background:#0d0d1a;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;color:#eee;overflow:hidden}
    .container{text-align:center;padding:40px}
    .snake{font-size:120px;animation:float 3s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
    .code{font-size:120px;font-weight:700;background:linear-gradient(135deg,#00ff88,#00cc6a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0}
    .msg{color:#888;font-size:18px;margin-bottom:32px}
    .btn{display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#00ff88,#00cc6a);color:#0d0d1a;border:none;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;transition:all .3s;cursor:pointer;font-family:inherit}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,255,136,.3)}
    .dots{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:.03}
    .dots div{position:absolute;width:2px;height:2px;background:#00ff88;border-radius:50%}
  </style>
</head>
<body>
  <div class="dots" id="dots"></div>
  <div class="container">
    <div class="snake"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);margin-right:4px;vertical-align:bottom;"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" x2="20" y1="19" y2="19"></line></svg></div>
    <div class="code">404</div>
    <p class="msg">Ой! Бет табылмады</p>
    <a href="index.html" class="btn">🏠 Басты бетке оралу →</a>
  </div>
  <script>
    var dots=document.getElementById('dots');for(var i=0;i<30;i++){var d=document.createElement('div');d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';dots.appendChild(d)}
  </script>
</body>
</html>
